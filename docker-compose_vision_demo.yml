# Deployment artifact: upload as a thin-edge.io `container-group` software item
# in Cumulocity. The plugin materializes it to its own compose directory and
# brings it up, REGENERATING it on every install — so device-side edits are
# discarded. This file is the source of truth and must stay in step with
# docker-compose.yml (scripts/check-compose-sync.py enforces that).
#
# Deliberate differences: `version: "3.7"` and no `name:`/`pull_policy:` (the
# device runs docker-compose 1.29.2, which rejects those keys), absolute host
# paths (the plugin runs this from its own directory, so ./ would misresolve),
# `extra_hosts`, and a pinned image tag.
#
# Prerequisite: thin-edge.io on the host with MQTT (1883) and the Cumulocity
# proxy (8001) on localhost, and the pipeline files in /opt/vision_demo/.
version: "3.7"

services:
  pipeline:
    # PINNED, deliberately not :latest — a device resolves an unchanged image
    # reference to the copy it already holds, so a floating tag makes an update
    # a silent no-op. Bump this in the same commit as the release tag; CI checks
    # the two agree. No leading "v": git tag v0.0.9 publishes image tag 0.0.9.
    image: ${PIPELINE_IMAGE:-ghcr.io/mstoffel-sag/vision-demo:0.0.10}

    # Lets otc_capture reach the camera over Ethernet (subnet scan + UDP stream)
    # and the host's thin-edge MQTT broker / c8y proxy on localhost.
    network_mode: host

    volumes:
      # Hot-reloaded by the runner every cycle — edit in place on the device.
      - /opt/vision_demo/pipeline/config/pipeline.json:/opt/tedge-pipeline/config/pipeline.json
      - /opt/vision_demo/pipeline/processors/preprocessor.py:/opt/tedge-pipeline/processors/preprocessor.py
      - /opt/vision_demo/pipeline/processors/postprocessor.py:/opt/tedge-pipeline/processors/postprocessor.py
      # Starts the long-lived otc_capture process. Baked into the image since
      # 0.0.9, so this mount is now a convenience — it deploys entrypoint changes
      # without a rebuild. Runs at container start only; recreate to apply one.
      - /opt/vision_demo/docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # Optional: override the baked-in model (must match frame_width/height +
      # grid_rows/cols in pipeline.json). Build with build_thermal_model.py:
      # - /opt/vision_demo/pipeline/model.onnx:/opt/tedge-pipeline/models/model.onnx
      # Persist captured frames and the SDK's per-camera calibration cache.
      - captures:/opt/tedge-pipeline/data/captures
      - optris-calib:/root/.config/optris

    restart: unless-stopped

    extra_hosts:
      - host.containers.internal:host-gateway
      - host.docker.internal:host-gateway

volumes:
  captures:
  optris-calib:
