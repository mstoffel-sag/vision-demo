# Override that BUILDS the image from source (compiles otc_capture against the
# Optris SDK, builds the ONNX model) instead of pulling it from GHCR:
#
#   cp .env.example .env      # pick the Optris SDK version
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Carries ONLY the build stanza — networking, mounts, volumes and restart policy
# are inherited from docker-compose.yml, so the mount list has one definition.

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Optris Thermal Camera SDK — github.com/Optris/otcsdk_downloads/releases
        OTCSDK_VERSION: ${OTCSDK_VERSION:-11.3.0}
        OTCSDK_UBUNTU: ${OTCSDK_UBUNTU:-24.04}
    image: vision-demo-pipeline:local
    # docker-compose.yml sets `pull_policy: always` for the published image;
    # override it here or Compose would try to pull the local build tag.
    pull_policy: build
