name: vision-demo

# Runs the full thermal workflow in one container: otc_capture -> ONNX
# inference -> Cumulocity via thin-edge.io on the host.
#
#   docker compose up -d                                    # pull and run
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.build.yml up --build    # build from source
#
# Pulls the multi-arch image CI publishes on each v* release; override the
# image/tag with PIPELINE_IMAGE, and `docker login ghcr.io` first if the GHCR
# package is private.
#
# Prerequisite: thin-edge.io on the host with MQTT (1883) and the Cumulocity
# HTTP proxy (8001) reachable on localhost.

services:
  pipeline:
    image: ${PIPELINE_IMAGE:-ghcr.io/mstoffel-sag/vision-demo:latest}
    # Always re-pull so `up` fetches the latest published image.
    pull_policy: always

    # Lets otc_capture reach the camera over Ethernet (subnet scan + UDP stream)
    # and the host's thin-edge MQTT broker / c8y proxy on localhost.
    network_mode: host

    volumes:
      # Hot-reloaded by the runner every cycle — edit in place on the host.
      - ./pipeline/config/pipeline.json:/opt/tedge-pipeline/config/pipeline.json
      - ./pipeline/processors/preprocessor.py:/opt/tedge-pipeline/processors/preprocessor.py
      - ./pipeline/processors/postprocessor.py:/opt/tedge-pipeline/processors/postprocessor.py
      # Starts the long-lived otc_capture process; mounted so camera/capture
      # changes apply without a rebuild. Runs at container start only, so
      # `docker compose up -d` (recreate) to apply a change.
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # Optional: override the baked-in model (must match frame_width/height +
      # grid_rows/cols in pipeline.json). Build with build_thermal_model.py:
      # - ./pipeline/model.onnx:/opt/tedge-pipeline/models/model.onnx
      # Persist captured frames and the SDK's per-camera calibration cache.
      - captures:/opt/tedge-pipeline/data/captures
      - optris-calib:/root/.config/optris

    restart: unless-stopped

volumes:
  captures:
  optris-calib:
